[project]
name = "asrecorded"
version = "0.0.0"
description = "A read-only record of how each change reached the default branch of GitHub repositories"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]
"scripts/history_check.py" = ["S603", "S607"]

[tool.mypy]
strict = true
files = ["scripts", "tests"]
mypy_path = "scripts"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["scripts"]
branch = true

[tool.coverage.report]
exclude_also = ['if __name__ == "__main__":']
show_missing = true
