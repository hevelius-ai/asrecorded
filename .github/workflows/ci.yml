# AsRecorded's own gate: lint, format, types, tests with full coverage, and the history check,
# on Ubuntu and Windows. It reads the repository only.

name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Install the pinned tools (exact versions, hashes checked)
        run: python -m pip install --require-hashes -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Format
        run: python -m ruff format --check .

      - name: Types
        run: python -m mypy

      - name: Tests, with 100% line and branch coverage
        run: python -m pytest --cov --cov-report=term-missing --cov-fail-under=100

      - name: History check (every commit of this pull request and of main)
        run: python scripts/history_check.py
